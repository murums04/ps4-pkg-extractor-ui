name: Desktop builds and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-crypto++
            mingw-w64-ucrt-x86_64-zlib
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-build.txt
      - name: Install Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          $setup = Join-Path $PWD '.tools/innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'Compiler checksum mismatch' }
          $compiler = Join-Path $PWD '.tools/InnoSetup'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', ('/DIR="' + $compiler + '"'))
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $compiler 'ISCC.exe'))) { throw 'Compiler missing' }
          Remove-Item -LiteralPath $setup
      - name: Build and verify
        shell: pwsh
        run: |
          $env:PATH = '${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin;' + $env:PATH
          .venv/Scripts/python.exe scripts/build.py --iscc .tools/InnoSetup/ISCC.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/verify.py installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/verify.py distribution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ps4-pkg-extractor-ui-windows-x64
          path: |
            packages/*.zip
            packages/*.exe
            packages/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-12 libcrypto++-dev zlib1g-dev dpkg-dev xvfb desktop-file-utils libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 libxext6 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake cryptopp zlib
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt
      - name: Build Linux
        if: runner.os == 'Linux'
        env:
          CXX: g++-12
        run: |
          xvfb-run -a .venv/bin/python scripts/build.py
          desktop-file-validate packaging/ps4-pkg-extractor-ui.desktop
          .venv/bin/python scripts/verify.py distribution
          xvfb-run -a .venv/bin/python scripts/verify_native_installers.py --install
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix):$(brew --prefix zlib)"
          .venv/bin/python scripts/build.py
          .venv/bin/python scripts/verify.py distribution
          .venv/bin/python scripts/verify_native_installers.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ps4-pkg-extractor-ui-${{ matrix.target }}
          path: |
            packages/*.zip
            packages/*.dmg
            packages/*.tar.gz
            packages/*.deb
            packages/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7
